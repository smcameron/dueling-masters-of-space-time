name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout gh-pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh_pages

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Run unit tests
        run: make -C src test

      - name: Build Emscripten web target
        run: make -C src web

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/play
          cp -a _gh_pages/. _site/
          rm -rf _site/.git
          cp src/web/index.html src/web/index.js src/web/index.wasm src/web/index.data _site/play/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
