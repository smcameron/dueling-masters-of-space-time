<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dueling Masters of Space Time</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101218;
    color: #dce2ec;
    font-family: monospace;
  }
  #canvas {
    width: 100vw;
    height: 100vh;
    display: block;
    outline: none;
  }
  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 14px 20px;
    background: rgba(24, 28, 38, 0.92);
    border: 1px solid #586278;
    border-radius: 4px;
    font-size: 16px;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">Loading Dueling Masters of Space Time...</div>
<script>
  var statusEl = document.getElementById('loading');
  var canvasEl = document.getElementById('canvas');

  canvasEl.addEventListener('mousedown', function() {
    canvasEl.focus();
  });

  canvasEl.addEventListener('webglcontextlost', function(e) {
    alert('WebGL context lost. Reload the page to continue.');
    e.preventDefault();
  }, false);

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
        e.key === 'PageUp' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
    }
  }, false);

  var Module = {
    canvas: (function() { return canvasEl; })(),
    setStatus: function(text) {
      if (!text) {
        statusEl.style.display = 'none';
      } else {
        statusEl.style.display = 'block';
        statusEl.textContent = text;
      }
    },
    totalDependencies: 0,
    monitorRunDependencies: function(left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left
        ? 'Loading (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...'
        : '');
    },
    printErr: function(text) {
      if (arguments.length > 1)
        text = Array.prototype.slice.call(arguments).join(' ');
      console.error(text);
    }
  };
  Module.setStatus('Loading Dueling Masters of Space Time...');
</script>
{{{ SCRIPT }}}
</body>
</html>
